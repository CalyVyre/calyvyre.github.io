<!DOCTYPE html>
<html>
<head>
    <title>CalyVyre</title>

    <style>
        body {
            margin: 0;
            font-family: Segoe UI, Arial;
            background: linear-gradient(120deg, #0d1117, #111827);
            color: white;
            overflow: hidden;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 0 90px;
        }

        .left {
            max-width: 560px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #a78bfa;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 22px;
        }

        p {
            font-size: 19px;
            color: #c9d1d9;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(90deg, #7c3aed, #9333ea);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            margin-right: 18px;
            transition: 0.2s;
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.25);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .link {
            color: #a78bfa;
            text-decoration: none;
            font-size: 17px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .right {
            width: 420px;
            height: 420px;
            border-radius: 30px;
            background:
                radial-gradient(circle at top, rgba(124,58,237,0.25), transparent 60%),
                rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="logo">CalyVyre</div>

        <h1>
            Rewire your mind.<br>
            Build calm discipline.
        </h1>

        <p>
            CalyVyre helps you train focus, improve mindset,
            and build consistency through mental awareness
            and disciplined thinking.
        </p>

        <a class="btn" href="https://github.com/CalyVyre/CalyVyre-App">
            Download for Windows
        </a>

        <a class="link" href="https://github.com/CalyVyre">
            View on GitHub →
        </a>

    </div>

    <!-- Right Side -->
    <div class="right"></div>

</div>

</body>
</html>
